<div class="w-dvw h-auto grid grid-cols-1 grid-rows-1 items-center justify-items-center">
  <div class="w-auto h-auto">
              <div class="w-fit ">
                  <div class="py-5 text-center">
                    <h1 class="text-blue-500 text-4xl">Admin Signup</h1>
                  </div>
                  <div class="p-3 w-full" >
                    <!-- <p class="text-red-500 ">*Admin Only</p> -->
                         <form action="" [formGroup]="signupForm">
                          <div class="flex flex-col items-center gap-3 mb-6">
                            <div class="flex flex-col " >
                              <label for="name">Full Name</label>
                              <input type="text" formControlName="name" class="outline-none border border-gray-500 rounded-md p-1" name="name" id="name" placeholder="full Name">
                              <p class="text-red-500 m-0 p-0" *ngIf="checkInvalidFields('name')">*invalid name</p>
                           </div>
                            <div class="flex flex-col" >
                               <label for="email">Email</label>
                               <input type="email" formControlName="email" class="outline-none border border-gray-500 rounded-md p-1" name="email" id="email" placeholder="email">
                              <p class="text-red-500 m-0 p-0" *ngIf="checkInvalidFields('email')">*invalid email</p>
                            </div>

                            <div class="flex flex-col " >
                              <label for="password">Password</label>
                              <input type="password" formControlName="password" class="outline-none border border-gray-500 rounded-md p-1" name="password" id="password" placeholder="password">
                              <p class="text-red-500 m-0 p-0 " *ngIf="checkInvalidFields('password')">*invalid password  </p>

                           </div>

                          </div>

                           <div class="flex flex-col gap-3 my-7 ">
                            <button class="p-1 bg-blue-500 w-4/5 mx-auto rounded-sm" (click)="onSignup()">Signup</button>
                          </div>
                          <p class="text-gray-600 ">Already have a  account  ?  <span class="text-blue-600 cursor-pointer " [routerLink]="['/login']">Login</span></p>
                         </form>
                  </div>
              </div>
  </div>

</div>
