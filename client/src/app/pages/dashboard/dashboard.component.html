<!-- Modal -->

<div id="crud-modal" *ngIf="toggleEmployeeForm"  class=" overflow-y-hidden overflow-x-hidden absolute top-5 left-4/12 z-50 justify-center items-center w-auto  max-h-full">
   <div class="relative p-4 w-full max-w-md max-h-full">
       <!-- Modal content -->
       <div class="relative bg-white rounded-lg shadow-md shadow-gray-400">
           <!-- Modal header -->
           <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t border-gray-200">
               <h3 class="text-lg font-semibold text-gray-900">
                   Create New Product
               </h3>
               <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark" (click)="toggleFormModal()">
                   <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                       <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                   </svg>
                   <span class="sr-only">Close modal</span>
               </button>
           </div>
           <!-- Modal body -->
           <form class="p-4 md:p-5" [formGroup]="addForm">
               <div class="grid gap-3 mb-3 grid-cols-2">
                   <div class="col-span-2">
                       <label for="name" class="block mb-2 text-sm font-medium text-gray-900 ">Name</label>
                       <input type="text" [ngClass]="{'border-red-500':checkInvalidFields('name')}" formControlName="name" name="name" id="name" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block outline-none w-full p-2.5" placeholder="Enter Your Name" required="">
                       
                   </div>
                   <div class="col-span-2">
                       <label for="email" class="block mb-2 text-sm font-medium text-gray-900 ">Email</label>
                       <input type="email" [ngClass]="{'border-red-500':checkInvalidFields('email')}" formControlName="email" name="email" id="email" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 outline-none block w-full p-2.5" placeholder="Enter Your Email" required="">
                   </div>
                   <div class="col-span-2">
                       <label for="password" class="block mb-2 text-sm font-medium text-gray-900 ">Password</label>
                       <input type="text" [ngClass]="{'border-red-500':checkInvalidFields('password')}" name="password" formControlName="password" id="password" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 outline-none block w-full p-2.5" placeholder="Enter Your Password" required="">
                   </div>
                   <div class="col-span-2">
                       <label for="position" class="block mb-2 text-sm font-medium text-gray-900 ">Position</label>
                       <input type="text" [ngClass]="{'border-red-500':checkInvalidFields('position')}" name="position" formControlName="position" id="position" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 outline-none block w-full p-2.5" placeholder="Enter Your position" required="">
                   </div>
                   <div class="col-span-2 sm:col-span-1">
                       <label for="salary" class="block mb-2 text-sm font-medium text-gray-900 ">Salary</label>
                       <input type="number" [ngClass]="{'border-red-500':checkInvalidFields('salary')}" formControlName="salary" name="salary" id="salary" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 outline-none block w-full p-2.5" placeholder="$2999" required="">
                   </div>
                   <div class="col-span-2 sm:col-span-1">
                       <label for="date" class="block mb-2 text-sm font-medium text-gray-900 ">DOB</label>
                       <input type="DATE" name="date" [ngClass]="{'border-red-500':checkInvalidFields('dob')}" formControlName="dob" id="date"  class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg outline-none focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5"  required="">
                   </div>
                   <div class="col-span-2 ">
                       <label for="department" class="block mb-2 text-sm font-medium text-gray-900 ">Department</label>
                       <select id="department" [ngClass]="{'border-red-500':checkInvalidFields('department')}" formControlName="department" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg outline-none focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 " >
                           <option selected value="" >Select Department</option>
                           <option value="{{item}}" *ngFor="let item of departments">{{item}}</option>
                       </select>
                   </div>
                  
               </div>
               <button type="submit" class="text-white inline-flex items-center bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center" (click)="addEmployee()">
                   <svg class="me-1 -ms-1 w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd"></path></svg>
                   Add Employee
               </button>
           </form>
       </div>
   </div>
   </div>
