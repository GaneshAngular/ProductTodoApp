<div
  class="w-full h-15 bg-inherit text-inherit flex justify-between items-center min-md:px-20 border dark:border-b-red border-b-gray-400"
>
  <div class=" flex items-end gap-20  w-1/3">
    <div>
      <h1 class="text-4xl">
        <span class="text-blue-500">E</span><span class="text-blue-300">M</span
          ><span class="text-blue-100">S</span>
        </h1>
      </div>
      <div  *ngIf="isUser">

      </div>

  </div>

  <div
    *ngIf="toggleMenu"
    [ngClass]="{'bg-white text-black':!darkTheme}"
    class="flex absolute  flex-col w-1/3 bg-black  min-md:w-1/8  top-1/10 right-3 z-10 border border-gray-700 shadow shadow-gray-500 py-3 items-center gap-y-3"
  >

    <li
      *ngIf="isUser"
      (click)="logOut()"
      class=" cursor-pointer list-none "
    >
     LogOut
    </li>


    <li  *ngIf="isUser" class="list-none  cursor-pointer" [routerLink]="['/profile']" routerLinkActive="router-link-active" >
      View Profile
    </li>

  </div>
</div>
